name: iOS Build

on:
  push:
    branches:
      - main
      - feature/bodybuilder-toolkit
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sync bundled web app
        run: bash scripts/sync-ios-web.sh

      - name: Validate web and native integration
        run: |
          for script in *.js; do node --check "$script"; done
          node scripts/validate-source.mjs
          git diff --exit-code

      - name: Build iOS Simulator app
        run: |
          # The scheme builds the iPhone app plus its embedded Live Activity
          # widget and watchOS app, each against its own simulator SDK.
          xcodebuild \
            -project ios/PeakSet.xcodeproj \
            -scheme PeakSet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
